# NOFX Fork Deployment
# 默认使用官方镜像，可通过环境变量覆盖为自建镜像：
#   NOFX_BACKEND_IMAGE=my-registry/nofx-backend:dev
#   NOFX_FRONTEND_IMAGE=my-registry/nofx-frontend:dev
#
# 一键部署示例（从 fork 获取脚本）：
# curl -fsSL https://raw.githubusercontent.com/FYCFY/nofx/dev/install-fork.sh | bash

services:
  nofx:
    image: ${NOFX_BACKEND_IMAGE:-ghcr.io/fycfy/nofx/nofx-backend:dev}
    container_name: nofx-trading
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${NOFX_BACKEND_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - AI_MAX_TOKENS=8000
    networks:
      - nofx-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nofx-frontend:
    image: ${NOFX_FRONTEND_IMAGE:-ghcr.io/fycfy/nofx/nofx-frontend:dev}
    container_name: nofx-frontend
    restart: unless-stopped
    ports:
      - "${NOFX_FRONTEND_PORT:-3000}:80"
    networks:
      - nofx-network
    depends_on:
      - nofx
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  nofx-network:
    driver: bridge
